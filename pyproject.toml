[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-proving-ground"
version = "0.1.1"
description = "Test an AI tool against a reference standard: Wilson intervals, paired comparison, calibration and a written report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "M. Ali Saghiri" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["proving_ground"]

[tool.pytest.ini_options]
pythonpath = ["."]
